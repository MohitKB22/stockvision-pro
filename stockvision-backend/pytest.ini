[pytest]
# Restrict collection to tests/ — pytest's default rootdir discovery also picks up
# scripts/e2e_*.py (their names match the default `*_test.py` pattern), and those
# are standalone HTTP scripts that construct a client at import time. Collecting
# them turned every local `pytest` run into a confusing ImportError before a
# single real test executed.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:shap.*
    ignore::FutureWarning:sklearn.*
