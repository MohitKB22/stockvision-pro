name: Verify live deployment

# Checks a deployed StockVision Pro from the outside, the way a visitor uses it:
#   1. scripts/smoke_test.py — 37 HTTP checks against the API (both markets,
#      portfolio + risk engine, train -> predict with SHAP, report round trip,
#      CORS for the frontend origin, frontend pages served)
#   2. a headless-Chromium walk through all 11 pages, failing on console errors,
#      failed API calls or error text on screen
# Run it from the Actions tab (or `gh workflow run verify.yml -f api_url=... -f web_url=...`).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API origin, e.g. https://stockvision-pro-api.vercel.app"
        required: true
      web_url:
        description: "Frontend origin, e.g. https://stockvision-pro.vercel.app"
        required: true

permissions:
  contents: read

env:
  # Inputs reach the scripts as environment variables, never spliced into shell code.
  API_URL: ${{ inputs.api_url }}
  WEB_URL: ${{ inputs.web_url }}

jobs:
  verify:
    name: Verify live site
    # Pinned: Playwright's --with-deps installs packages by Ubuntu release, and
    # ubuntu-latest moves to a release it may not know yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # explicit shell = -eo pipefail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: API + frontend smoke test
        id: smoke
        run: |
          python stockvision-backend/scripts/smoke_test.py "$API_URL" \
            --origin "$WEB_URL" --frontend "$WEB_URL" | tee smoke.txt
        continue-on-error: true

      - name: Browser walk through every page
        id: browser
        run: |
          if ! { npm install --no-save --no-audit --no-fund playwright@1.56.1 &&
                 npx playwright install --with-deps chromium; } > setup.log 2>&1; then
            tail -20 setup.log
            echo "  - browser setup failed: $(tail -3 setup.log | tr '\n' ' ')" > browser.txt
            exit 1
          fi
          node .github/scripts/browser_walk.mjs "$WEB_URL" screenshots 2>&1 | tee browser.txt
        continue-on-error: true

      - name: Report
        if: always()
        run: |
          smoke=$(grep -shE ' passed, [0-9]+ failed' smoke.txt | tail -1 || true)
          pages=$(grep -shE 'pages, [0-9]+ problem' browser.txt | tail -1 || true)
          smoke=${smoke:-smoke test did not finish}
          pages=${pages:-browser walk did not finish}
          { echo "## Live verification"; echo; echo "- API: $API_URL"; echo "- App: $WEB_URL";
            echo; echo '```'; cat smoke.txt browser.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.smoke.outcome }}" = "success" ] && [ "${{ steps.browser.outcome }}" = "success" ]; then
            echo "::notice title=Live verification passed::$smoke | $pages"
          else
            failures=$( (grep -shE '^\s+- |Error|error:' smoke.txt browser.txt || true) | head -12 | tr '\n' ';' )
            echo "::error title=Live verification failed::$smoke | $pages | $failures"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: screenshots/
          if-no-files-found: ignore
