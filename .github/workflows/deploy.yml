name: Deploy

# Production deploy to Vercel's free Hobby plan (frontend + API) with a Neon
# free-plan PostgreSQL database. Runs after CI passes on main, or by hand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN  - https://vercel.com/account/settings/tokens
#   DATABASE_URL  - Neon connection string (postgresql://...)
# Without them this workflow skips itself with a warning instead of failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel and smoke-test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy skipped::Missing repository secrets:$missing (see .github/workflows/deploy.yml)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm install --global vercel@64.3.1

      - name: Deploy API + frontend, then smoke-test the live site
        if: steps.gate.outputs.ready == 'true'
        run: python .github/scripts/deploy_vercel.py
