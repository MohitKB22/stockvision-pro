name: CI

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

concurrency:
  # A new push supersedes the previous run for the same ref — otherwise a rapid
  # series of pushes queues N full matrix builds nobody will read.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: stockvision-backend }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stockvision-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app scripts tests migrations

      - name: Test (pytest)
        # SQLite in-memory: the suite is fully isolated from any external service,
        # which is what lets it run on a bare runner with no sidecars.
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite:///:memory:"
          RATE_LIMIT_ENABLED: "false"
        run: pytest -q

      - name: Verify the app imports and the schema builds
        env:
          DATABASE_URL: "sqlite:///./ci-check.db"
        run: |
          python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"
          python -c "from app.core.database import Base, engine; import app.models; Base.metadata.create_all(engine); print(f'{len(Base.metadata.tables)} tables created')"

      - name: Assert no authentication code survives
        # A regression guard, not a formality: re-introducing an auth import would
        # silently resurrect the subsystem this release deliberately removed.
        # AST-based, not grep — the source discusses the removal in its CHANGE LOG
        # docstrings, and a text search matches that prose and fails the build for
        # documenting history accurately.
        run: python scripts/check_no_auth.py

  frontend:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: stockvision-frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stockvision-frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Assert no authentication code survives
        run: node scripts/check-no-auth.mjs

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run: { working-directory: stockvision-backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stockvision-backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Seed a database and exercise every endpoint
        env:
          DATABASE_URL: "sqlite:///./e2e.db"
          RATE_LIMIT_ENABLED: "false"
          LOG_LEVEL: "ERROR"
        run: |
          python scripts/seed_data.py --market IN
          python scripts/e2e_api_test.py

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./stockvision-backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./stockvision-frontend
          push: false
          build-args: NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
