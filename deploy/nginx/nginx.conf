# =============================================================================
# Reverse proxy: one origin for the SPA and the API.
#
# Serving both under a single origin eliminates CORS preflights entirely — /api/*
# is same-origin from the SPA's point of view — which removes a whole class of
# "works locally, fails in prod" deployment issue.
# =============================================================================

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

# Rate limiting at the edge, in addition to the application's own limiter. The
# app limiter is per-process and does not survive a restart; this one protects
# the API before a request ever reaches Python.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 26m;   # matches MAX_UPLOAD_BYTES (25 MB) plus multipart overhead
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SSE for the copilot stream. Declared BEFORE the generic /api/ block so it
    # wins the longest-prefix match; buffering must be off or the entire "stream"
    # arrives at once when the response completes, defeating the purpose.
    location /api/v1/copilot/query/stream {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Without this the application's rate limiter sees only the proxy's IP and
        # buckets every client together — one noisy client would throttle everyone.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # Model training and PDF ingestion are genuinely slow; the default 60s read
        # timeout truncates them mid-request.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass http://api_upstream/health;
        access_log off;
    }

    location /metrics {
        proxy_pass http://api_upstream/metrics;
        # Metrics are for the scraper, not the internet. Restricted to private
        # ranges; narrow this to your Prometheus host in a real deployment.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location /docs   { proxy_pass http://api_upstream/docs; }
    location /redoc  { proxy_pass http://api_upstream/redoc; }
    location /openapi.json { proxy_pass http://api_upstream/openapi.json; }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";   # Next.js HMR in dev
    }
}
